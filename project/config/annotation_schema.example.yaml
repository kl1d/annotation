event_types:
  - choice
  - attempt
  - failure
  - retry_loop
  - debug
  - pivot
  - suspected_deception
  - abandon
  - success
  - design_issue
  - other
required_event_fields:
  - start_time_sec
  - event_type
  - title
optional_event_fields:
  - end_time_sec
  - task_path
  - evidence_note
  - tag_ids
field_config:
  start_time_sec:
    label: Start
    input: timecode
  end_time_sec:
    label: End
    input: timecode
  event_type:
    label: Event type
    input: select
    options_from: event_types
  task_path:
    label: Task name
    input: text
    suggestions:
      - A1
      - A2
      - B1
      - B2
      - B3
  title:
    label: Title
    input: text
  evidence_note:
    label: Notes
    input: textarea
  tag_ids:
    label: Tags
    input: tags
